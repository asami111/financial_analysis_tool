[project]
name = "financial-analysis-tool"
version = "0.1.0"
description = "Analyze a transaction history: recurring payments, balance forecast and recommendations for savings and investments."
readme = "README.md"
authors = [
    { name = "Andrew Awad", email = "andrewsamihsm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
